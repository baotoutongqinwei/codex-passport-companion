name: Build firmware

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware connection profile
        required: true
        default: ble
        type: choice
        options:
          - ble
          - usb
          - wifi
          - offline

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ inputs.profile }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.profile }}-${{ github.ref_name }}-
            ccache-

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware --profile ${{ inputs.profile }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-passport-${{ inputs.profile }}-${{ github.sha }}
          path: build/variants/${{ inputs.profile }}/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
