name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/codex-companion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Repository and host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository and run host tests
        run: |
          python3 -m venv .local/ci-venv
          .local/ci-venv/bin/python -m pip install -r bridge/requirements.txt
          source .local/ci-venv/bin/activate
          ./tools/validate.sh --static
